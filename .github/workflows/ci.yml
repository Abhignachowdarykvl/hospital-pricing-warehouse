name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hpw
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: hospital_pricing
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        env:
          POSTGRES_USER: hpw
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: hospital_pricing
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          CMS_INPATIENT_DATASET_ID: placeholder
          CMS_HOSPITAL_INFO_DATASET_ID: placeholder
          AWS_REGION: us-east-2
          S3_BUCKET: placeholder
        run: python -m pytest -q
